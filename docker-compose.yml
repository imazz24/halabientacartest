# Al Halabi Rent — full stack: FastAPI + SQLite + Next.js
#   docker compose up --build      first run (seeds the database)
#   Website  http://localhost:3000
#   API docs http://localhost:8000/docs
services:
  backend:
    build: ./backend
    container_name: alhalabi-backend
    environment:
      # SQLite file and company settings live in the `database` volume.
      DATABASE_URL: sqlite:////data/car_rental.db
      FRONTEND_URL: http://localhost:3000
      # Override these before putting the site online.
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      COMPANY_WHATSAPP_NUMBER: ${COMPANY_WHATSAPP_NUMBER:-96170858510}
    volumes:
      - database:/data
      - uploads:/app/app/static/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: alhalabi-frontend
    environment:
      # Used by the Next.js rewrites and by server-side data fetching.
      BACKEND_URL: http://backend:8000
      # The Docker build bakes demo mode OFF (real backend above).
      NEXT_PUBLIC_DEMO: "0"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  database:
  uploads:
